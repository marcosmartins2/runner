name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint - estilo Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: go vet (bloqueante)
        run: go vet ./...
      - name: gofmt (informativo)
        run: |
          offenders=$(gofmt -l .)
          if [ -n "$offenders" ]; then
            echo "::warning::Arquivos fora do padrao gofmt (rode 'gofmt -w .'):"
            echo "$offenders"
          else
            echo "Tudo conforme gofmt."
          fi

  test-java-assinador:
    name: Tests - assinador.jar (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assinador
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode test
      - name: Package
        run: mvn --batch-mode package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: assinador-jar
          path: assinador/target/assinador-*.jar
          retention-days: 7

  test-java-simulador:
    name: Tests - simulador.jar (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simuladorjar
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode test
      - name: Package
        run: mvn --batch-mode package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: simulador-jar
          path: simuladorjar/target/simulador.jar
          retention-days: 7

  test-go:
    name: Tests - CLIs Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build-go:
    name: Cross-compile binarios
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: go mod tidy
        run: go mod tidy
      - name: Compilar todas as plataformas
        run: |
          mkdir -p dist
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-X main.version=dev -X main.commit=${COMMIT}"
          for target in linux/amd64 windows/amd64 darwin/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -ldflags "${LDFLAGS}" \
              -o "dist/assinatura-${os}-${arch}${ext}" ./cmd/assinatura
            GOOS="$os" GOARCH="$arch" go build -ldflags "${LDFLAGS}" \
              -o "dist/simulador-${os}-${arch}${ext}" ./cmd/simulador
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/
          retention-days: 7
