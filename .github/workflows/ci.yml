name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-java:
    name: Tests - assinador (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assinador
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn --batch-mode test

      - name: Package jar
        run: mvn --batch-mode package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: assinador-jar
          path: assinador/target/assinador-*.jar
          retention-days: 7

  test-python-assinatura:
    name: Tests - assinatura (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        working-directory: assinatura
        run: python -m unittest test_assinatura.py -v

  test-python-simulador:
    name: Tests - simulador (Python)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        working-directory: simulador
        run: python -m unittest test_simulador.py -v
